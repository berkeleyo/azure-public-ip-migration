name: PowerShell CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Enforce PowerShell analysis
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $findings = @(Invoke-ScriptAnalyzer -Path './scripts' -Recurse -Severity Error,Warning)
          if ($findings.Count -gt 0) {
            $findings | Format-Table ScriptName, Line, RuleName, Severity, Message -Wrap | Out-String | Write-Host
            throw "PSScriptAnalyzer found $($findings.Count) error/warning finding(s)."
          }
          Write-Host 'PSScriptAnalyzer passed: no error/warning findings.'
